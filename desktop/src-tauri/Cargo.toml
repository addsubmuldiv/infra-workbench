[package]
name = "infra-workbench-desktop"
version = "0.1.0"
description = "Infra Workbench desktop entrance"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
open = "5"
dirs = "6"
rfd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
