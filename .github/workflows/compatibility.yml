name: Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ['3.11', '3.13']
    env:
      IWB_TEST_TRAY: '0'
      IWB_TEST_KEYCHAIN: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/generate-internal-defaults.mjs --check
      - run: node --test scripts/generate-internal-defaults.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test backend (including native POSIX PTY on Linux and macOS)
        env:
          IWB_DATA: ${{ runner.temp }}/iwb-tests-${{ matrix.os }}-${{ matrix.python }}
        run: python -m pytest tests -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node ../scripts/generate-internal-defaults.mjs --check
      - run: npm ci
      - run: npm test
      - run: npm run build
