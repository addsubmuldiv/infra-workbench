name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Also build experimental macOS packages'
        type: boolean
        default: false
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
    inputs:
      ref:
        required: true
        type: string
      include_macos:
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'requirements*.txt'
      - 'scripts/check-webkit-performance-compat.cjs'
      - 'scripts/check-desktop-flows.cjs'
      - 'scripts/desktop-benchmark-server.cjs'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || inputs.include_macos) && fromJSON('["windows-latest","macos-15","macos-15-intel"]') || fromJSON('["windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Create Python environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-dev.txt -r desktop/requirements-build.txt
      - name: Create Python environment (macOS)
        if: runner.os == 'macOS'
        env:
          # Intel may build cryptography from source. Keep its OpenSSL private;
          # otherwise PyInstaller can select Python's older libssl of the same name.
          OPENSSL_STATIC: '1'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -r desktop/requirements-build.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - run: node --test release.test.mjs
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: npm run build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          IWB_UNSIGNED_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - name: Collect signed update artifacts
        if: github.event_name != 'pull_request'
        working-directory: desktop
        run: node release.mjs collect src-tauri/target/release/bundle ../release-assets
      - name: Install WebKit compatibility test runtime
        run: |
          npm install --prefix work/desktop-benchmark --no-save ws@8 playwright@1.64.1
          node work/desktop-benchmark/node_modules/playwright/cli.js install webkit
      - name: Check shared UI on WebKit (including missing newer APIs)
        run: node scripts/check-webkit-performance-compat.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: webkit-check-${{ matrix.os }}
          path: |
            work/performance-round2/webkit-compat.json
            work/performance-round2/webkit-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request'
        with:
          name: desktop-unsigned-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Preserve packaging diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-check-${{ matrix.os }}
          path: |
            work/desktop-build/runtime-self-test.json
            work/desktop-build/build/iwb-runtime/warn-iwb-runtime.txt
          if-no-files-found: ignore
