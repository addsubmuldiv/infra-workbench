name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node desktop/release.mjs version "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}
  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify artifact set and generate checksums
        run: node desktop/release.mjs checksums release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Infra Workbench $RELEASE_TAG" --notes "Windows (x64) and macOS (Apple Silicon and Intel) installers. These builds are unsigned and macOS builds are not notarized. Review platform verification and known limitations before publishing. SHA256SUMS.txt verifies download integrity; it does not authenticate the publisher."
