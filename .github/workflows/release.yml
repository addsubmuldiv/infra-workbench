name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/generate-internal-defaults.mjs --check
          node desktop/release.mjs version "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      ref: ${{ needs.validate.outputs.tag }}
      include_macos: true
  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate release notes, signed update feed and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="${RELEASE_TAG#v}" '
            /^## / {
              if (found) exit
              found = ($2 == version)
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes"
          node desktop/release.mjs manifest release-assets "${RELEASE_TAG#v}" "$notes"
          node desktop/release.mjs checksums release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Infra Workbench $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
