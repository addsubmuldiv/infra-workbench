name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.1.0)'
        required: true
        type: string
      include_macos:
        description: 'Also release experimental macOS packages (all builds must pass)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node desktop/release.mjs version "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      ref: ${{ needs.validate.outputs.tag }}
      include_macos: ${{ inputs.include_macos || false }}
  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate signed update feed and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          INCLUDE_MACOS: ${{ inputs.include_macos || false }}
        run: |
          # Intel Mac is no longer a release target. Require every supported
          # artifact explicitly before using the manifest's partial-platform mode.
          test -s "release-assets/Infra-Workbench-${RELEASE_TAG#v}-windows-x86_64-setup.exe"
          if [ "$INCLUDE_MACOS" = "true" ]; then
            test -s "release-assets/Infra-Workbench-${RELEASE_TAG#v}-darwin-aarch64.app.tar.gz"
            test -s "release-assets/Infra-Workbench-${RELEASE_TAG#v}-darwin-aarch64.dmg"
          fi
          flags=(--partial)
          node desktop/release.mjs manifest release-assets "${RELEASE_TAG#v}" CHANGELOG.md "${flags[@]}"
          node desktop/release.mjs checksums release-assets "${flags[@]}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Infra Workbench $RELEASE_TAG" --notes "Signed updater release. Windows x64 is the default target; experimental macOS packages are included only when explicitly requested. Updater artifacts are cryptographically signed. Windows installers have no Authenticode signature, and macOS builds are not notarized. Review platform verification and known limitations before publishing. SHA256SUMS.txt verifies download integrity; it does not authenticate the publisher."
